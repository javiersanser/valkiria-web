server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Include MIME types
    include /etc/nginx/mime.types;

    # Serve static files
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets
    location /_astro {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # OG images - ensure proper content-type and caching for social crawlers
    location ~* ^/og-image\.(png|jpg|jpeg|webp)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Branding assets
    location /branding/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # No cache for HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}